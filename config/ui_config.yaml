# ==============================================================================
# Kugane UI Configuration
# User-tweakable settings for position, dimensions, colors, and fonts.
# Changes take effect on next launch.
# ==============================================================================

# Window Positioning
position:
  # Distance from the top edge of the screen (in pixels). Increase to move further down.
  top_y: 48
  # Horizontal alignment: "center", "left", "right"
  align_x: "center"
  # Horizontal offset from alignment center (in pixels)
  offset_x: 0

# Dimensions & Layout
dimensions:
  # Main compact pill dimensions
  compact_width: 224
  compact_height: 40

  # Expanded conversation card dimensions
  expanded_width: 480
  expanded_height: 520

  # Space between the main top pill and the conversation card (~5pt = 7px)
  # Gives the floating dual-bubble appearance
  pill_gap: 7

# Visual Theme & Colors (Hex, rgb, or rgba)
colors:
  # Surface gradient for expanded conversation card
  surface_top: "#141726"
  surface_bottom: "#0D1019"
  surface_border: "rgba(120, 146, 255, 0.16)"

  # Compact pill capsule gradient
  capsule_top: "#262E44"
  capsule_bottom: "#181E2E"
  capsule_hover_top: "#303B56"
  capsule_hover_bottom: "#1F273C"
  capsule_border: "rgba(120, 146, 255, 0.20)"
  capsule_border_hover: "rgba(142, 165, 255, 0.35)"

  # Message bubbles
  user_bubble_start: "#314E85"
  user_bubble_end: "#243860"
  user_bubble_border: "rgba(120, 146, 255, 0.25)"

  assistant_bubble_start: "#1C2333"
  assistant_bubble_end: "#151A26"
  assistant_bubble_border: "rgba(120, 146, 255, 0.15)"

  # Message input composer
  composer_top: "#1E2536"
  composer_bottom: "#151B27"
  composer_border: "rgba(120, 146, 255, 0.22)"

  # Accents
  accent_blue: "#7892FF"
  accent_blue_hover: "#8EA5FF"
  accent_green: "#58D6A0"
  accent_amber: "#FFB300"
  accent_red: "#FF4444"

  # Typography colors
  text_primary: "#E5E9F2"
  text_secondary: "#9BAAC5"
  text_muted: "#6B7B99"

# Typography
fonts:
  family: "JetBrainsMono Nerd Font"
  bold: true

