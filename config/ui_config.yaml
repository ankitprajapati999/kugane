# ==============================================================================
# Kugane UI Configuration
# User-tweakable settings for position, dimensions, colors, and fonts.
# Changes take effect on next launch.
# ==============================================================================

# Window Positioning
position:
  # Distance from the top edge of the screen (0 = stuck flush to top bezel)
  top_y: 0
  # Horizontal alignment: "center", "left", "right"
  align_x: "center"
  # Horizontal offset from alignment center (in pixels)
  offset_x: 0

# Dimensions & Layout
dimensions:
  # Physical size targets for the compact notch (inches, converted via screen DPI)
  compact_width_inches: 4.7
  compact_height_inches: 0.525

  # Fallback pixel dimensions if physical DPI is unavailable
  compact_width: 427
  compact_height: 48

  # Expanded conversation panel dimensions
  expanded_width: 480
  expanded_height: 520
  min_expanded_width: 360
  min_expanded_height: 320

  # Dynamic Island notch curve radii (pixels)
  ear_radius: 14
  compact_bottom_radius: 18
  expanded_bottom_radius: 28

# Visual Theme & Colors (Pitch-Black Notch Theme)
colors:
  # Pitch-black notch background & balanced grayish hover backlight
  notch_bg: "#000000"
  notch_border: "rgba(255, 255, 255, 0.14)"
  notch_border_hover: "rgba(185, 188, 198, 0.56)"

  # Message bubbles (pitch-black / dark graphite)
  user_bubble_start: "#1B1B20"
  user_bubble_end: "#141418"
  user_bubble_border: "rgba(255, 212, 0, 0.25)"

  assistant_bubble_start: "#0F0F12"
  assistant_bubble_end: "#09090B"
  assistant_bubble_border: "rgba(255, 255, 255, 0.10)"

  # Message input composer
  composer_top: "#111115"
  composer_bottom: "#0A0A0D"
  composer_border: "rgba(255, 255, 255, 0.14)"

  # Accents (Kugane gold + status colors)
  accent_primary: "#FFD400"
  accent_primary_hover: "#FFE033"
  accent_blue: "#FFD400"
  accent_blue_hover: "#FFE033"
  accent_green: "#32D74B"
  accent_amber: "#FF9F0A"
  accent_red: "#FF453A"

  # Typography colors
  text_primary: "#FFFFFF"
  text_secondary: "#98989F"
  text_muted: "#636369"

# Typography
fonts:
  family: "Poppins"
  fallback_family: "Outfit"
  bold: false

