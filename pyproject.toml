[project]
name = "kugane"
version = "0.1.0"
description = "Kugane — local AI desktop assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7.0",
    "google-genai>=1.0.0",
    "langchain>=1.5.2",
    "langchain-core>=1.8.5",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.24",
    "mss>=10.2.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.4",
]

[tool.uv]
package = false
